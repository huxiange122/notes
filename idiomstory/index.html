<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f0e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="description" content="按记忆曲线推送的儿童成语学习工具：听故事、做考点、看成绩曲线、自动复习错题。">
<title>成语小书院 · 胡嘉逸的成语成长册</title>
<style>
/* ===== 成语小书院 · 视觉样式（移动端优先，无外部依赖） ===== */
:root {
  --paper: #f6f0e3;
  --paper-2: #fffdf6;
  --paper-3: #efe6d3;
  --ink: #2e2822;
  --ink-2: #6f6559;
  --ink-3: #9c9182;
  --red: #b5372c;
  --red-2: #d2604f;
  --gold: #bd8a2f;
  --gold-2: #e0b458;
  --green: #3d7a5b;
  --green-2: #5ba37c;
  --line: rgba(86, 68, 45, 0.14);
  --shadow: 0 6px 20px rgba(80, 60, 35, 0.08);
  --radius: 18px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { margin: 0; padding: 0; }

body {
  background:
    radial-gradient(1200px 600px at 12% -8%, #fffdf5 0%, rgba(255, 253, 245, 0) 60%),
    radial-gradient(900px 500px at 100% 100%, #f0e5cf 0%, rgba(240, 229, 207, 0) 55%),
    var(--paper);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

.kai { font-family: "Kaiti SC", "STKaiti", "KaiTi", "Kaiti", "Songti SC", serif; }

#app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 10px;
  padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
  background: rgba(246, 240, 227, 0.92);
  backdrop-filter: saturate(1.1) blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand-seal {
  width: 36px; height: 36px; flex: 0 0 36px;
  display: grid; place-items: center;
  background: linear-gradient(160deg, var(--red-2), var(--red));
  color: #fff8ec; border-radius: 9px;
  font-family: "Kaiti SC", "KaiTi", serif; font-size: 21px; line-height: 1;
  box-shadow: 0 3px 8px rgba(150, 50, 40, 0.25);
}
.brand-text { flex: 1; min-width: 0; }
.brand-title { font-family: "Kaiti SC", "KaiTi", serif; font-size: 18px; letter-spacing: .5px; line-height: 1.25; }
.brand-sub { font-size: 11px; color: var(--ink-3); letter-spacing: .3px; }
.icon-btn {
  width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.6); color: var(--ink-2);
  display: grid; place-items: center; cursor: pointer; font-size: 15px;
}
.icon-btn:active { transform: scale(.96); }

.shell {
  width: 100%; max-width: 600px; margin: 0 auto;
  padding: 14px 16px calc(84px + env(safe-area-inset-bottom));
  flex: 1;
}
.shell.no-tabs { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }

/* ---------- 通用卡片 ---------- */
.card {
  background: linear-gradient(180deg, var(--paper-2), #fdf9ef);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 14px;
}
.card.flush { padding: 0; overflow: hidden; }

.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }

h2.section {
  font-family: "Kaiti SC", "KaiTi", serif;
  font-size: 17px; font-weight: 600; margin: 4px 0 10px;
  display: flex; align-items: center; gap: 8px;
}
h2.section::before {
  content: ""; width: 4px; height: 16px; border-radius: 2px;
  background: linear-gradient(var(--red-2), var(--red));
}

.muted { color: var(--ink-2); }
.tiny { font-size: 12px; color: var(--ink-3); }
.center { text-align: center; }
.mono { font-variant-numeric: tabular-nums; }

/* ---------- 按钮 ---------- */
.btn {
  appearance: none; border: none; cursor: pointer;
  font-family: inherit; font-size: 16px; font-weight: 600;
  padding: 14px 16px; border-radius: 14px;
  min-height: 48px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .12s ease, box-shadow .12s ease, background .15s;
  text-align: center;
}
.btn:active { transform: translateY(1px) scale(.995); }
.btn-primary {
  background: linear-gradient(160deg, var(--red-2), var(--red));
  color: #fff8ee;
  box-shadow: 0 6px 16px rgba(170, 55, 42, 0.24);
}
.btn-gold {
  background: linear-gradient(160deg, var(--gold-2), var(--gold));
  color: #3a2a0d;
  box-shadow: 0 6px 16px rgba(180, 130, 40, 0.22);
}
.btn-ghost {
  background: rgba(255, 255, 255, 0.66);
  color: var(--ink);
  border: 1px solid var(--line);
  box-shadow: none;
}
.btn-soft {
  background: rgba(181, 55, 44, 0.08);
  color: var(--red);
  border: 1px solid rgba(181, 55, 44, 0.18);
  box-shadow: none;
}
.btn-block { width: 100%; }
.btn-sm { font-size: 13px; padding: 9px 12px; min-height: 38px; border-radius: 11px; font-weight: 500; }
.btn:disabled { opacity: .5; pointer-events: none; }

/* ---------- 首页 ---------- */
.hero {
  position: relative; overflow: hidden;
  padding: 20px 18px 18px;
  background:
    radial-gradient(120% 90% at 100% 0%, rgba(224, 180, 88, 0.20), rgba(224, 180, 88, 0) 60%),
    linear-gradient(160deg, #fffdf6 0%, #fbf4e4 100%);
}
.hero::after {
  content: "成";
  position: absolute; right: -10px; bottom: -42px;
  font-family: "Kaiti SC", "KaiTi", serif; font-size: 116px;
  color: rgba(181, 55, 44, 0.05); line-height: 1;
  pointer-events: none;
}
.hero .btn-ghost { background: #fffdf6; }
.hero > * { position: relative; z-index: 1; }
.hero::after { z-index: 0; }
.hero-date { font-size: 12px; color: var(--ink-3); letter-spacing: .5px; }
.hero-greet { font-family: "Kaiti SC", "KaiTi", serif; font-size: 24px; margin: 6px 0 4px; letter-spacing: 1px; }
.hero-greet em { font-style: normal; color: var(--red); }
.hero-desc { font-size: 13px; color: var(--ink-2); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 18px; }
.stat {
  background: rgba(255, 255, 255, 0.62);
  border: 1px solid var(--line); border-radius: 14px;
  padding: 10px 8px; text-align: center;
}
.stat-num { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat-num small { font-size: 12px; font-weight: 500; color: var(--ink-3); }
.stat-label { font-size: 11px; color: var(--ink-3); margin-top: 2px; }

.cta-stack { display: grid; gap: 10px; }
.cta-note { font-size: 12px; color: var(--ink-3); text-align: center; margin-top: 2px; }

/* ---------- 进度 ---------- */
.level-block { margin-top: 4px; }
.level-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.level-tag {
  flex: 0 0 auto; font-size: 11px; padding: 3px 8px; border-radius: 999px;
  background: rgba(189, 138, 47, 0.12); color: #8a6417; border: 1px solid rgba(189, 138, 47, 0.25);
  white-space: nowrap;
}
.bar { flex: 1; height: 8px; border-radius: 999px; background: rgba(86, 68, 45, 0.10); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--gold-2), var(--gold)); width: 0; transition: width .5s ease; }
.level-num { flex: 0 0 auto; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ---------- 听故事 ---------- */
.listen-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(86, 68, 45, 0.16); }
.dot.on { background: var(--red-2); }
.dot.cur { background: var(--gold); box-shadow: 0 0 0 3px rgba(224, 180, 88, 0.28); }

.word-hero { text-align: center; padding: 6px 0 2px; }
.word-hero .word {
  font-family: "Kaiti SC", "KaiTi", serif;
  font-size: clamp(38px, 12vw, 50px); letter-spacing: 6px;
  line-height: 1.2; color: var(--ink);
}
.word-hero .pinyin { font-size: 13px; color: var(--ink-3); letter-spacing: 1px; margin-top: 2px; }
.word-hero .badge {
  display: inline-block; margin-top: 8px; font-size: 11px; padding: 3px 9px;
  border-radius: 999px; background: rgba(61, 122, 91, 0.10); color: #33684f;
  border: 1px solid rgba(61, 122, 91, 0.20);
}

.speak-bar { display: flex; gap: 8px; margin: 14px 0 4px; }
.speak-bar .btn { flex: 1; }

.meta-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin: 14px 0 4px;
}
.meta-item {
  background: rgba(255, 255, 255, 0.55); border: 1px solid var(--line);
  border-radius: 12px; padding: 8px 10px;
}
.meta-item .k { font-size: 11px; color: var(--ink-3); margin-bottom: 2px; }
.meta-item .v { font-size: 13.5px; color: var(--ink); line-height: 1.5; word-break: break-word; }
.meta-item.wide { grid-column: 1 / -1; }

.story-box {
  margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line);
}
.story-box h3, .lesson-box h3 {
  font-family: "Kaiti SC", "KaiTi", serif; font-size: 15px; margin: 0 0 8px;
  color: var(--red); letter-spacing: .5px;
}
.story-text { font-size: 15.5px; line-height: 1.95; text-align: justify; color: #3a332b; }
.story-text::first-letter { font-size: 1.35em; color: var(--red); font-family: "Kaiti SC", "KaiTi", serif; }
.lesson-box {
  margin-top: 14px; padding: 12px 14px; border-radius: 12px;
  background: linear-gradient(160deg, rgba(189, 138, 47, 0.10), rgba(189, 138, 47, 0.04));
  border: 1px solid rgba(189, 138, 47, 0.20);
}
.lesson-box .txt { font-size: 14px; color: #6a4d12; line-height: 1.75; }

.nav-btns { display: flex; gap: 10px; margin-top: 16px; }
.nav-btns .btn { flex: 1; }

/* ---------- 测试 ---------- */
.test-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 12px; color: var(--ink-3); }
.test-bar { height: 5px; border-radius: 999px; background: rgba(86, 68, 45, 0.10); overflow: hidden; margin-bottom: 16px; }
.test-bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--red-2), var(--red)); width: 0; transition: width .3s; }

.q-word { font-family: "Kaiti SC", "KaiTi", serif; font-size: 18px; letter-spacing: 3px; color: var(--ink-2); text-align: center; }
.q-text { font-family: "Kaiti SC", "KaiTi", serif; font-size: 21px; line-height: 1.55; margin: 8px 0 16px; text-align: center; letter-spacing: .5px; }

.opts { display: grid; gap: 9px; }
.opt {
  display: flex; align-items: flex-start; gap: 10px;
  width: 100%; text-align: left;
  padding: 13px 14px; border-radius: 13px; min-height: 50px;
  background: rgba(255, 255, 255, 0.72);
  border: 1px solid var(--line); color: var(--ink);
  font-family: inherit; font-size: 15.5px; line-height: 1.5;
  cursor: pointer; transition: border-color .12s, background .12s, transform .1s;
}
.opt:active { transform: scale(.99); }
.opt .k {
  flex: 0 0 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center; font-size: 12px; font-weight: 700;
  background: rgba(86, 68, 45, 0.08); color: var(--ink-2);
}
.opt.right { border-color: rgba(61, 122, 91, 0.55); background: rgba(91, 163, 124, 0.14); }
.opt.right .k { background: var(--green); color: #fff; }
.opt.wrong { border-color: rgba(181, 55, 44, 0.55); background: rgba(210, 96, 79, 0.13); }
.opt.wrong .k { background: var(--red); color: #fff; }
.opt.dim { opacity: .55; }

.input-wrap { margin-top: 4px; }
.answer-input {
  width: 100%; padding: 14px 16px; font-size: 18px;
  font-family: inherit; color: var(--ink);
  background: rgba(255, 255, 255, 0.85);
  border: 1.5px solid rgba(181, 55, 44, 0.28);
  border-radius: 13px; outline: none;
  text-align: center; letter-spacing: 2px;
}
.answer-input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(181, 55, 44, 0.10); }
.answer-input:disabled { opacity: .8; }
.input-tip { text-align: center; font-size: 12px; color: var(--ink-3); margin-top: 8px; }
.input-row { display: flex; gap: 10px; margin-top: 10px; }
.input-row .btn { flex: 1; }

.feedback {
  margin-top: 16px; padding: 14px; border-radius: 14px;
  animation: fadeUp .25s ease both;
}
.feedback.ok { background: rgba(91, 163, 124, 0.12); border: 1px solid rgba(61, 122, 91, 0.25); }
.feedback.no { background: rgba(210, 96, 79, 0.10); border: 1px solid rgba(181, 55, 44, 0.22); }
.feedback .fb-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
.feedback.ok .fb-title { color: #2f6b4d; }
.feedback.no .fb-title { color: var(--red); }
.feedback .fb-answer { font-size: 14px; color: var(--ink); }
.feedback .fb-note { font-size: 12.5px; color: var(--ink-2); margin-top: 8px; line-height: 1.7; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- 结算 ---------- */
.result-card { text-align: center; padding: 22px 18px 20px; position: relative; overflow: hidden; }
.score-ring { width: 148px; height: 148px; margin: 4px auto 6px; position: relative; }
.score-ring svg { width: 100%; height: 100%; }
.score-num {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 42px; font-weight: 800; font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.score-num small { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 2px; }
.result-title { font-family: "Kaiti SC", "KaiTi", serif; font-size: 22px; margin: 6px 0 4px; letter-spacing: .5px; }
.result-sub { font-size: 14px; color: var(--ink-2); line-height: 1.7; padding: 0 6px; }
.result-sub.low { color: var(--red); }

.thumb-wrap { display: flex; justify-content: center; margin: 10px 0 2px; }
.thumb-emoji { font-size: 84px; line-height: 1; animation: pop 1.4s cubic-bezier(.2, .9, .2, 1) infinite alternate; filter: drop-shadow(0 8px 14px rgba(180, 130, 40, 0.28)); }
@keyframes pop { from { transform: scale(.94) rotate(-3deg); } to { transform: scale(1.06) rotate(3deg); } }
.stars { font-size: 20px; color: var(--gold); letter-spacing: 3px; margin-top: 2px; }

.wrong-list { margin-top: 16px; text-align: left; }
.wrong-item {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px 12px; border-radius: 12px;
  background: rgba(255, 255, 255, 0.6); border: 1px solid var(--line); margin-bottom: 8px;
}
.wrong-item .w { font-family: "Kaiti SC", "KaiTi", serif; font-size: 16px; letter-spacing: 2px; flex: 0 0 auto; }
.wrong-item .d { font-size: 12.5px; color: var(--ink-2); line-height: 1.6; }

/* ---------- 曲线 ---------- */
.chart-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
.chart { display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-3); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

.record-list { margin-top: 6px; }
.record {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 2px; border-bottom: 1px dashed var(--line); font-size: 13px;
}
.record:last-child { border-bottom: none; }
.record .no { flex: 0 0 34px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.record .type { flex: 0 0 auto; font-size: 11px; padding: 2px 7px; border-radius: 999px; background: rgba(86, 68, 45, 0.07); color: var(--ink-2); }
.record .sc { flex: 1; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.record .sc.great { color: var(--gold); }
.record .sc.good { color: var(--green); }
.record .sc.low { color: var(--red); }

/* ---------- 错题本 ---------- */
.wb-item { padding: 12px 0; border-bottom: 1px dashed var(--line); }
.wb-item:last-child { border-bottom: none; }
.wb-head { display: flex; align-items: center; gap: 8px; }
.wb-word { font-family: "Kaiti SC", "KaiTi", serif; font-size: 19px; letter-spacing: 2px; }
.wb-badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgba(181, 55, 44, 0.10); color: var(--red); }
.wb-meta { font-size: 12px; color: var(--ink-3); margin-top: 4px; }

/* ---------- 设置 ---------- */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.set-row:last-child { border-bottom: none; }
.set-row .t { font-size: 14px; }
.set-row .d { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.switch {
  position: relative; width: 48px; height: 28px; border-radius: 999px; border: none;
  background: rgba(86, 68, 45, 0.16); cursor: pointer; transition: background .2s; flex: 0 0 48px;
}
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
  background: #fff; border-radius: 50%; transition: transform .2s; box-shadow: 0 1px 4px rgba(0,0,0,.18);
}
.switch.on { background: var(--green-2); }
.switch.on::after { transform: translateX(20px); }
.seg { display: flex; gap: 6px; }
.seg button {
  border: 1px solid var(--line); background: rgba(255,255,255,.6); color: var(--ink-2);
  padding: 6px 10px; border-radius: 9px; font-size: 12px; cursor: pointer; font-family: inherit;
}
.seg button.on { background: var(--red); color: #fff; border-color: var(--red); }

/* ---------- 底部导航 ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: rgba(255, 253, 246, 0.94);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar button {
  appearance: none; border: none; background: none; cursor: pointer;
  padding: 7px 4px 5px; color: var(--ink-3); font-family: inherit; font-size: 11px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.tabbar button > span:last-child { line-height: 1.3; }
.tabbar button .ic { width: 22px; height: 22px; display: grid; place-items: center; }
.tabbar button.on { color: var(--red); }
.tabbar button.on .ic { color: var(--red); }
.tabbar .badge-dot {
  position: absolute; transform: translate(14px, -2px);
  min-width: 15px; height: 15px; border-radius: 999px; background: var(--red);
  color: #fff; font-size: 9px; line-height: 15px; text-align: center; padding: 0 4px;
}

/* ---------- 提示 ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(8px);
  background: rgba(46, 40, 34, 0.92); color: #fff8ec;
  padding: 10px 16px; border-radius: 12px; font-size: 13px;
  max-width: 80vw; text-align: center; line-height: 1.5;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 90;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.modal {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(38, 32, 26, 0.45);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 0; animation: fadeUp .2s ease both;
}
.modal-box {
  width: 100%; max-width: 600px; max-height: 86vh; overflow-y: auto;
  background: var(--paper-2); border-radius: 20px 20px 0 0;
  padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow: 0 -8px 30px rgba(0,0,0,.18);
}
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.modal-head h3 { font-family: "Kaiti SC", "KaiTi", serif; font-size: 18px; margin: 0; }

.empty { text-align: center; padding: 34px 12px; color: var(--ink-3); }
.empty .big { font-size: 30px; margin-bottom: 8px; }

.hint-strip {
  display: flex; gap: 8px; align-items: flex-start;
  font-size: 12.5px; color: var(--ink-2);
  background: rgba(189, 138, 47, 0.08);
  border: 1px solid rgba(189, 138, 47, 0.18);
  border-radius: 12px; padding: 10px 12px; margin-bottom: 14px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }

<script>
(function () {
'use strict';

/* ============ 第 1 部分：数据、状态、记忆曲线、语音、会话 ============ */

var BY_ID = {};

var STORE_KEY = 'hj_chengyu_v1';
var DAY = 24 * 60 * 60 * 1000;

var MAX_STAGE = 7;
// 记忆曲线排期：第 1~7 轮分别间隔 1/2/4/7/15/30/60 天
var STAGE_DAYS = { 1: 1, 2: 2, 3: 4, 4: 7, 5: 15, 6: 30, 7: 60 };

var state;
var storageOK = true;
var view = 'home';
var toastTimer = null;
var ttsOK = typeof window.speechSynthesis !== 'undefined';
var voices = [];
var audioCtx = null;

var ICONS = {
  home: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3.5 10.6 12 3.6l8.5 7"/><path d="M5.6 9.4V20.4h12.8V9.4"/><path d="M9.6 20.4v-6.2h4.8v6.2"/></svg>',

  wrong: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4.5" y="3" width="15" height="18" rx="2.5"/><path d="M8 7.5h8M8 11.5h8M8 15.5h5"/></svg>',
  gear: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.2v2.2M12 18.6v2.2M3.2 12h2.2M18.6 12h2.2M5.8 5.8l1.6 1.6M16.6 16.6l1.6 1.6M18.2 5.8l-1.6 1.6M7.4 16.6l-1.6 1.6"/></svg>'

/* ---------------- 工具 ---------------- */
function $(sel, root) { return (root || document).querySelector(sel); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function fmtDate(ts) { var d = new Date(ts); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

function weekdayCN(ts) { return '星期' + '日一二三四五六'.charAt(new Date(ts).getDay()); }
function norm(s) {
  return String(s == null ? '' : s).toLowerCase()
    .replace(/[\s\u3000，,。.、；;：:！!？?“”"'‘’（）()《》<>·\-—_~`]/g, '');
}
function pct(a, b) { return b > 0 ? Math.round(a / b * 100) : 0; }
function shuffleIdx(n) {
  var arr = [], i, j, tmp;
  for (i = 0; i < n; i++) arr.push(i);
  for (i = n - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp; }
  return arr;
}

/* ---------------- 状态 ---------------- */
function defaultState() {
  return {
    v: 1,
    child: '胡嘉逸',
    parent: '胡先鸽',
    settings: { tts: true, rate: 0.9, autoRead: true, sfx: true },
    learned: {},
    wrong: {},
    scores: [],
    session: null,
    groupSeq: 0
  };
}
function deepMerge(base, extra) {
  if (!extra || typeof extra !== 'object') return base;
  Object.keys(extra).forEach(function (k) {
    var a = base[k], b = extra[k];
    if (b && typeof b === 'object' && !Array.isArray(b) && a && typeof a === 'object' && !Array.isArray(a)) {
      base[k] = deepMerge(a, b);
    } else {
      base[k] = b;
    }
  });
  return base;
}
function loadState() {
  var base = defaultState();
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) base = deepMerge(base, JSON.parse(raw));
  } catch (e) { storageOK = false; }
  return base;
}
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    storageOK = true;
    return true;
  } catch (e) { storageOK = false; return false; }
}

/* ---------------- 记忆曲线 ---------------- */
function stageLabel(stage) {
  if (!stage) return '未开始';
  if (stage >= MAX_STAGE) return '已稳固';
  return '第' + stage + '轮复习';
}
function dueText(ts) {
  var diff = ts - Date.now();
  if (diff <= 0) return '现在该复习';
  var h = Math.round(diff / 3600000);
  if (h < 24) return h <= 1 ? '约 1 小时后' : '约 ' + h + ' 小时后';
  return '约 ' + Math.round(diff / DAY) + ' 天后';
}
function dueList() {
  var now = Date.now();
  return Object.keys(state.learned).filter(function (id) {
    var p = state.learned[id];
    return BY_ID[id] && p && p.due && p.due <= now;
  }).sort(function (a, b) {
    var wa = state.wrong[a] ? state.wrong[a].count : 0;
    var wb = state.wrong[b] ? state.wrong[b].count : 0;
    if (wa !== wb) return wb - wa;
    return (state.learned[a].due || 0) - (state.learned[b].due || 0);
  });
}
function updateProgress(id, res) {
  var now = Date.now();
  var p = state.learned[id];
  if (!p) p = state.learned[id] = { stage: 1, due: now, right: 0, wrong: 0, created: now, last: now };
  p.last = now;
  if (res.ok === res.total) {
    p.stage = Math.min(MAX_STAGE, (p.stage || 1) + 1);
    p.due = now + (STAGE_DAYS[p.stage] || 60) * DAY;
    p.right = (p.right || 0) + res.ok;
    if (state.wrong[id]) state.wrong[id].cleared = now;
  } else {
    p.stage = Math.max(1, (p.stage || 1) - 2);
    p.due = now + MIN10;
    var bad = res.total - res.ok;
    p.wrong = (p.wrong || 0) + bad;
    var w = state.wrong[id] || (state.wrong[id] = { count: 0, first: now });
    w.count += bad;
    w.last = now;
  }
}

/* ---------------- 语音 ---------------- */
function refreshVoices() {
  if (!ttsOK) return;
  try { voices = window.speechSynthesis.getVoices() || []; } catch (e) { voices = []; }
}
if (ttsOK) {
  try {
    refreshVoices();
    window.speechSynthesis.onvoiceschanged = refreshVoices;
  } catch (e) { }
}
function zhVoice() {
  var list = voices || [];
  var zh = list.filter(function (v) { return /zh[-_]?CN|Chinese|中文|普通话/i.test((v.lang || '') + ' ' + (v.name || '')); });
  return zh[0] || list[0] || null;
}
function stopSpeak() {
  if (!ttsOK) return;
  try { window.speechSynthesis.cancel(); } catch (e) { }
}
function speak(text) {
  if (!state.settings.tts) { toast('朗读已关闭，可在“设置”里打开'); return; }
  if (!ttsOK) { toast('当前浏览器不支持语音朗读，可以先看文字'); return; }
  try {
    window.speechSynthesis.cancel();
    var u = new window.SpeechSynthesisUtterance(String(text));
    u.lang = 'zh-CN';
    u.rate = state.settings.rate || 0.9;
    u.pitch = 1.03;
    var v = zhVoice();
    if (v) u.voice = v;
    u.onerror = function () { toast('语音播放失败，可以先看文字'); };
    window.speechSynthesis.speak(u);
  } catch (e) { toast('语音播放失败，可以先看文字'); }
}
function speakIdiom(it) { speak(it.word + '。' + it.meaning + '。' + it.story); }
function autoReadCurrent() {
  if (view !== 'listen') return;
  var s = state.session;
  if (!s || !s.ids[s.listenIdx]) return;
  speakIdiom(BY_ID[s.ids[s.listenIdx]]);
}

/* ---------------- 音效 ---------------- */
function sfx(kind) {
  if (!state.settings.sfx) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    var t0 = audioCtx.currentTime;
    function tone(freq, start, dur, type, vol) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0 + start);
      g.gain.setValueAtTime(vol || 0.15, t0 + start);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + start + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0 + start); o.stop(t0 + start + dur + 0.02);
    }
    if (kind === 'ok') { tone(880, 0, 0.16); tone(1180, 0.1, 0.22); }
    else if (kind === 'no') { tone(320, 0, 0.16, 'triangle', 0.12); tone(220, 0.14, 0.26, 'triangle', 0.12); }
    else if (kind === 'win') { tone(660, 0, 0.2); tone(880, 0.16, 0.2); tone(1100, 0.32, 0.34); }
  } catch (e) { }
}

function toast(msg, ms) {
  var t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, ms || 2600);
}

/* ---------------- 会话 ---------------- */
function pickNewIds(n) {
  var ids = [];
  IDIOMS.forEach(function (it) { if (!state.learned[it.id]) ids.push(it.id); });
  return ids.slice(0, n || GROUP_SIZE);
}
function buildQueue(ids, kind) {
  var out = [];
  ids.forEach(function (id) {
    var it = BY_ID[id];
    if (!it) return;
    var entries = it.q.map(function (q, i) { return { q: q, i: i }; });
    if (kind === 'review') {
      var mid = entries.filter(function (e) { return e.i > 0 && e.i < entries.length - 1; });
      var pick = mid.length ? mid[Math.floor(Math.random() * mid.length)] : entries[0];
      entries = [entries[0], pick, entries[entries.length - 1]];
    } else if (kind === 'wrong') {
      entries = entries.slice(0, 6);
    }
    entries.forEach(function (e) {
      out.push({
        id: id, qi: e.i,
        order: e.q.t === 'choice' ? shuffleIdx(e.q.o.length) : null
      });
    });
  });
  return out;
}
function newSession(kind, ids) {
  return {
    kind: kind, ids: ids,
    phase: kind === 'new' ? 'listen' : 'test',
    listenIdx: 0,
    queue: buildQueue(ids, kind),
    idx: 0,
    responses: {},
    startedAt: Date.now(),
    score: null, correct: 0, total: 0,
    wrongDetails: []
  };
}
function startNewGroup() {
  stopSpeak();
  var ids = pickNewIds(GROUP_SIZE);
  if (!ids.length) { toast('48 个成语都学过了，去“错题本 / 复习”里巩固吧'); return; }
  state.groupSeq = (state.groupSeq || 0) + 1;
  state.session = newSession('new', ids);
  view = 'listen';
  save(); render();
  if (state.settings.autoRead) setTimeout(autoReadCurrent, 300);
}
function startReview() {
  stopSpeak();
  var due = dueList();
  if (!due.length) { toast('现在没有到期要复习的成语，先学一组新的吧'); return; }
  var ids = due.slice(0, GROUP_SIZE);
  state.session = newSession('review', ids);
  view = 'test';
  save(); render();
}
function startDrill(ids) {
  stopSpeak();
  var list = (ids && ids.length) ? ids : Object.keys(state.wrong);
  if (!list.length) { toast('暂时没有错题'); return; }
  state.session = newSession('wrong', list.slice(0, GROUP_SIZE));
  view = 'test';
  save(); render();
}
function resumeSession() {
  var s = state.session;
  if (!s) { view = 'home'; render(); return; }
  view = s.phase === 'result' ? 'result' : (s.phase === 'listen' ? 'listen' : 'test');
  render();
  if (view === 'listen' && state.settings.autoRead) setTimeout(autoReadCurrent, 300);
}
function exitSession() {
  if (view === 'listen' || view === 'test') {
    if (!window.confirm('确定退出这一组吗？还没做完的题目不会计入成绩。')) return;
  }
  stopSpeak();
  state.session = null;
  view = 'home';
  save(); render();
}

/* ---------------- 作答与结算 ---------------- */
function currentItem() {
  var s = state.session;
  return s ? s.queue[s.idx] : null;
}
function submitAnswer(ok, userText) {
  var s = state.session, item = currentItem();
  if (!s || !item || s.responses[s.idx]) return;
  s.responses[s.idx] = { ok: !!ok, user: userText == null ? '' : String(userText), at: Date.now() };
  sfx(ok ? 'ok' : 'no');
  save(); render();
}
function checkInput(q, val) {
  var v = norm(val);
  if (!v) return false;
  var accepts = q.accept || [q.a];
  return accepts.some(function (a) {
    var t = norm(a);
    if (!t) return false;
    if (v === t) return true;
    if (t.length >= 2 && v.length >= 2 && (v.indexOf(t) !== -1 || t.indexOf(v) !== -1)) return true;
    return false;
  });
}
function nextQuestion() {
  var s = state.session;
  if (!s) return;
  if (s.idx < s.queue.length - 1) { s.idx += 1; save(); render(); }
  else finishTest();
}
function finishTest() {
  var s = state.session;
  if (!s) return;
  var byId = {}, correct = 0, total = 0;
  s.queue.forEach(function (item, idx) {
    var it = BY_ID[item.id];
    if (!it) return;
    var q = it.q[item.qi];
    var r = s.responses[idx];
    total += 1;
    var ok = !!(r && r.ok);
    if (ok) correct += 1;
    var o = byId[item.id] || (byId[item.id] = { total: 0, ok: 0, wrongItems: [] });
    o.total += 1;
    if (ok) o.ok += 1;
    else o.wrongItems.push({ ask: q.q, correct: q.t === 'choice' ? q.o[q.a] : q.a });
  });
  s.total = total; s.correct = correct; s.score = total ? pct(correct, total) : 0;
  Object.keys(byId).forEach(function (id) { updateProgress(id, byId[id]); });
  s.wrongDetails = Object.keys(byId).filter(function (id) { return byId[id].ok < byId[id].total; })
    .map(function (id) { return { id: id, items: byId[id].wrongItems }; });
  state.scores.push({
    t: Date.now(), score: s.score, type: s.kind, total: total, correct: correct,
    ids: s.ids.slice(), wrongIds: s.wrongDetails.map(function (w) { return w.id; })
  });
  s.phase = 'result';
  save();
  view = 'result';
  render();
  var g = gradeOf(s.score);
  sfx(g === 'great' ? 'win' : (g === 'low' ? 'no' : 'ok'));
  setTimeout(function () {
    if (g === 'great') speak('胡嘉逸你好厉害，' + s.score + '分，大拇指送给你！');
    else if (g === 'low') speak('胡嘉逸你还需要再努力，再仔细复习一遍，看你能把能过关，不行就告诉胡先鸽打你屁股！');
    else speak('胡嘉逸，进步啦，' + s.score + '分，再复习一下错题，下次一定更好。');
  }, 600);
}
function gradeOf(score) { return score >= 90 ? 'great' : (score >= 70 ? 'good' : 'low'); }

/* ============ 第 3 部分：结算、成绩曲线、错题本、设置、交互 ============ */

/* ---------------- 结算 ---------------- */
function renderResult() {
  var s = state.session;
  if (!s) return renderHome();
  var score = s.score == null ? 0 : s.score;
  var g = gradeOf(score);
  var ringColor = g === 'great' ? '#bd8a2f' : (g === 'good' ? '#3d7a5b' : '#b5372c');
  var C = 2 * Math.PI * 52;
  var offset = C - C * Math.min(100, Math.max(0, score)) / 100;
  var wrongList = s.wrongDetails || [];
  var typeText = s.kind === 'new' ? '新学一组' : (s.kind === 'review' ? '到期复习' : '错题重练');

  var title = '', sub = '', extra = '';
  if (g === 'great') {
    title = '胡嘉逸你好厉害！';
    sub = score + ' 分，大拇指送给你！这一组记得很牢。';
    extra = '<div class="thumb-wrap"><div class="thumb-emoji">👍</div></div><div class="stars">★ ★ ★</div>';
  } else if (g === 'good') {
    title = '胡嘉逸，进步啦！';
    sub = score + ' 分。把下面的错题再看一遍，下次就能冲 90 分以上。';
  } else {
    title = '还要再努力一下';
    sub = '胡嘉逸你还需要再努力，再仔细复习一遍，看你能把能过关，不行就告诉胡先鸽打你屁股！';
  }

  var wrongHtml = '';
  if (wrongList.length) {
    wrongHtml = '<div class="wrong-list">' +
      '<div class="row between" style="margin-bottom:8px">' +
      '<h2 class="section" style="margin:0">这一组错在哪儿（' + wrongList.length + ' 个成语）</h2></div>' +
      wrongList.map(function (w) {
        var it = BY_ID[w.id];
        if (!it) return '';
        var lines = w.items.slice(0, 2).map(function (x) {
          return '<div class="d">· ' + esc(x.ask) + ' → <strong>' + esc(x.correct) + '</strong></div>';
        }).join('');
        var more = w.items.length > 2 ? '<div class="d">· 还有 ' + (w.items.length - 2) + ' 处小错误，复习时会再考。</div>' : '';
        return '<div class="wrong-item" data-act="peek" data-id="' + it.id + '">' +
          '<div class="w kai">' + esc(it.word) + '</div>' +
          '<div style="flex:1">' + lines + more + '</div>' +
          '</div>';
      }).join('') +
      '<div class="tiny">点一下成语可以看故事；错题会自动进入错题本，并按记忆曲线高频出现。</div>' +
      '</div>';
  }

  var actions = '';
  if (g === 'great') {
    if (pickNewIds(GROUP_SIZE).length) {
      actions += '<button class="btn btn-primary btn-block" data-act="startNew">继续学下一组（10 个）</button>';
    } else {
      actions += '<button class="btn btn-primary btn-block" data-act="startReview">继续复习</button>';
    }
    actions += '<button class="btn btn-ghost btn-block" data-act="go" data-view="home">回首页</button>';
  } else if (g === 'good') {
    if (wrongList.length) actions += '<button class="btn btn-primary btn-block" data-act="drillWrong">复习这一组的错题（' + wrongList.length + ' 个）</button>';
    else actions += '<button class="btn btn-gold btn-block" data-act="retrySame">再测一次这一组</button>';
    actions += '<button class="btn btn-ghost btn-block" data-act="go" data-view="home">回首页</button>';
  } else {
    actions += '<button class="btn btn-primary btn-block" data-act="drillWrong">马上复习错题（' + Math.max(1, wrongList.length) + ' 个）</button>';
    actions += '<button class="btn btn-ghost btn-block" data-act="retrySame">把这一组重新测一遍</button>';
    actions += '<button class="btn btn-ghost btn-block" data-act="go" data-view="home">先回首页</button>';
  }

  return '<div class="card result-card">' +
    '<div class="tiny">' + typeText + ' · ' + fmtMD(s.startedAt || Date.now()) + ' ' + fmtTime(s.startedAt || Date.now()) + '</div>' +
    '<div class="score-ring"><svg viewBox="0 0 120 120">' +
    '<circle cx="60" cy="60" r="52" fill="none" stroke="rgba(86,68,45,.10)" stroke-width="10"></circle>' +
    '<circle cx="60" cy="60" r="52" fill="none" stroke="' + ringColor + '" stroke-width="10" stroke-linecap="round" ' +
    'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '" transform="rotate(-90 60 60)"></circle>' +
    '</svg><div class="score-num"><span>' + score + '<small>分</small></span></div></div>' +
    '<div class="result-title kai">' + title + '</div>' +
    '<div class="result-sub' + (g === 'low' ? ' low' : '') + '">' + sub + '</div>' +
    extra +
    '<div class="tiny" style="margin-top:10px">答对 ' + s.correct + ' / ' + s.total + ' 题</div>' +
    wrongHtml +
    '<div class="nav-btns" style="display:grid;gap:10px">' + actions + '</div>' +
    '<div class="center" style="margin-top:12px">' +
    '<button class="btn btn-ghost btn-sm" data-act="go" data-view="curve">看看我的成绩曲线</button>' +
    '</div>' +
    '</div>';
}

/* ---------------- 成绩曲线 ---------------- */
function chartSVG(records, mini) {
  var n = records.length;
  if (!n) return '';
  var W = mini ? 340 : (n <= 10 ? 330 : Math.max(330, 40 + n * 30));
  var H = mini ? 104 : 208;
  var padL = mini ? 26 : 30, padR = mini ? 10 : 14, padT = mini ? 10 : 16, padB = mini ? 16 : 26;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  function X(i) { return padL + (n === 1 ? plotW / 2 : i * plotW / (n - 1)); }
  function Y(v) { return padT + (100 - v) * plotH / 100; }

  var grid = [0, 50, 70, 90, 100].map(function (v) {
    var y = Y(v).toFixed(1);
    var isLine = (v === 70 || v === 90);
    var stroke = v === 90 ? 'rgba(189,138,47,.45)' : (v === 70 ? 'rgba(181,55,44,.35)' : 'rgba(86,68,45,.12)');
    return '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" stroke="' + stroke + '" stroke-width="1" ' +
      (isLine || v === 0 ? '' : 'stroke-dasharray="3 4"') + '></line>' +
      (mini ? '' : '<text x="' + (padL - 5) + '" y="' + (Number(y) + 3.5) + '" text-anchor="end" font-size="9" fill="#9c9182">' + v + '</text>');
  }).join('');

  var pts = records.map(function (r, i) { return X(i).toFixed(1) + ',' + Y(r.score).toFixed(1); }).join(' ');
  var area = 'M ' + X(0).toFixed(1) + ' ' + Y(0).toFixed(1) + ' L ' + pts.split(' ').join(' L ') + ' L ' + X(n - 1).toFixed(1) + ' ' + Y(0).toFixed(1) + ' Z';

  var dots = records.map(function (r, i) {
    var color = r.score >= 90 ? '#bd8a2f' : (r.score >= 70 ? '#3d7a5b' : '#b5372c');
    var rad = mini ? 2.6 : 4;
    return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(r.score).toFixed(1) + '" r="' + rad + '" fill="' + color + '" stroke="#fffdf6" stroke-width="1.2"></circle>' +
      (mini ? '' : '<text x="' + X(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="9" fill="#9c9182">' + (i + 1) + '</text>');
  }).join('');

  var lastLabel = mini ? '' :
    '<text x="' + (W - padR) + '" y="' + (Y(records[n - 1].score) - 8) + '" text-anchor="end" font-size="10" fill="#2e2822" font-weight="700">' + records[n - 1].score + '分</text>';

  return '<svg class="chart" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="成绩曲线">' +
    grid +
    '<path d="' + area + '" fill="rgba(189,138,47,.10)" stroke="none"></path>' +
    '<polyline points="' + pts + '" fill="none" stroke="rgba(86,68,45,.45)" stroke-width="1.6" stroke-linejoin="round"></polyline>' +
    dots + lastLabel +
    '</svg>';
}
function miniChart(records) {
  if (!records || !records.length) return '';
  return '<div class="chart-wrap" style="margin-top:8px">' + chartSVG(records, true) + '</div>';
}

function renderCurve() {
  var scores = state.scores || [];
  if (!scores.length) {
    return '<div class="card"><h2 class="section">成绩曲线</h2>' +
      '<div class="empty"><div class="big">📈</div>还没有成绩记录。<br>完成第一组测试后，这里会出现每轮的成绩曲线。</div></div>';
  }
  var avg = Math.round(scores.reduce(function (s, r) { return s + r.score; }, 0) / scores.length);
  var best = scores.reduce(function (m, r) { return Math.max(m, r.score); }, 0);
  var recent = scores.slice(-5);
  var recentAvg = Math.round(recent.reduce(function (s, r) { return s + r.score; }, 0) / recent.length);
  var last = scores[scores.length - 1].score;
  var trend = scores.length >= 2 ? (last - scores[scores.length - 2].score) : 0;

  var rows = scores.slice().reverse().map(function (r, i) {
    var no = scores.length - i;
    var cls = r.score >= 90 ? 'great' : (r.score >= 70 ? 'good' : 'low');
    var type = r.type === 'new' ? '新学' : (r.type === 'review' ? '复习' : '错题');
    return '<div class="record"><span class="no">#' + no + '</span>' +
      '<span class="type">' + type + '</span>' +
      '<span class="tiny" style="flex:1">' + fmtMD(r.t) + ' ' + fmtTime(r.t) + '</span>' +
      '<span class="sc ' + cls + '">' + r.score + '</span></div>';
  }).join('');

  return '<div class="card">' +
    '<h2 class="section">每轮成绩曲线</h2>' +
    '<div class="stats" style="margin:0 0 12px">' +
    '<div class="stat"><div class="stat-num">' + scores.length + '</div><div class="stat-label">总轮次</div></div>' +
    '<div class="stat"><div class="stat-num">' + avg + '</div><div class="stat-label">平均分</div></div>' +
    '<div class="stat"><div class="stat-num">' + best + '</div><div class="stat-label">最高分</div></div>' +
    '</div>' +
    '<div class="chart-wrap">' + chartSVG(scores, false) + '</div>' +
    '<div class="legend"><span><i style="background:#bd8a2f"></i>90 分以上</span>' +
    '<span><i style="background:#3d7a5b"></i>70–89 分</span>' +
    '<span><i style="background:#b5372c"></i>70 分以下</span>' +
    '<span>最近 5 次平均 ' + recentAvg + ' 分' + (trend > 0 ? '，比上轮 +' + trend : trend < 0 ? '，比上轮 ' + trend : '') + '</span></div>' +
    '<div class="tiny" style="margin-top:8px">虚线是 90 分（优秀）和 70 分（及格）参考线。横轴是第几轮测试。</div>' +
    '</div>' +
    '<div class="card"><h2 class="section">成绩明细</h2><div class="record-list">' + rows + '</div></div>';
}

/* ---------------- 错题本 ---------------- */
function renderWrongBook() {
  var items = Object.keys(state.wrong).filter(function (id) { return BY_ID[id]; }).map(function (id) {
    return { id: id, w: state.wrong[id], it: BY_ID[id], p: state.learned[id] || {} };
  }).sort(function (a, b) {
    if (b.w.count !== a.w.count) return b.w.count - a.w.count;
    return (b.w.last || 0) - (a.w.last || 0);
  });

  if (!items.length) {
    return '<div class="card"><h2 class="section">错题本</h2>' +
      '<div class="empty"><div class="big">🌱</div>还没有错题，说明每一组都掌握得不错！<br>如果答错，成语会自动记在这里，并优先安排复习。</div></div>';
  }

  var list = items.map(function (o) {
    var cleared = o.w.cleared && (!o.w.last || o.w.cleared >= o.w.last);
    return '<div class="wb-item">' +
      '<div class="wb-head"><span class="wb-word kai">' + esc(o.it.word) + '</span>' +
      '<span class="wb-badge">错 ' + o.w.count + ' 次</span>' +
      (cleared ? '<span class="tiny" style="color:#3d7a5b">已纠正</span>' : '') +
      '<span class="spacer"></span>' +
      (cleared ? '<button class="btn btn-ghost btn-sm" data-act="clearWrong" data-id="' + o.id + '">移出</button>' : '') +
      '<button class="btn btn-soft btn-sm" data-act="drillOne" data-id="' + o.id + '">重练</button>' +
      '</div>' +
      '<div class="wb-meta">L' + o.it.level + ' · ' + esc(o.it.dynasty) + ' · ' +
      (o.p.stage ? stageLabel(o.p.stage) + ' · ' : '') +
      (o.p.due ? (o.p.due <= Date.now() ? '现在该复习' : dueText(o.p.due) + '复习') : '还没安排复习') +
      (o.w.last ? ' · 最近错误 ' + fmtMD(o.w.last) : '') +
      '</div></div>';
  }).join('');

  return '<div class="card">' +
    '<div class="row between"><h2 class="section" style="margin:0">错题本（' + items.length + ' 个）</h2>' +
    '<button class="btn btn-primary btn-sm" data-act="drillAllWrong">全部重练</button></div>' +
    '<div class="tiny" style="margin-top:6px">错得越多的成语排得越前，复习时也会优先出现，直到全部答对。</div>' +
    '<div style="margin-top:6px">' + list + '</div>' +
    '</div>';
}

/* ---------------- 设置 ---------------- */
function renderSettings() {
  var s = state.settings;
  var learnedCount = Object.keys(state.learned).length;
  var scoreCount = state.scores.length;

  function row(title, desc, key) {
    return '<div class="set-row"><div><div class="t">' + title + '</div><div class="d">' + desc + '</div></div>' +
      '<button class="switch' + (s[key] ? ' on' : '') + '" data-act="toggle" data-key="' + key + '" aria-label="' + title + '"></button></div>';
  }

  return '<div class="card">' +
    '<h2 class="section">朗读与声音</h2>' +
    row('语音朗读', '用手机自带的中文语音读成语和故事', 'tts') +
    row('自动朗读故事', '进入每个故事页时自动读一遍', 'autoRead') +
    row('答对答错音效', '短促的提示音，不影响听力', 'sfx') +
    '<div class="set-row"><div><div class="t">朗读速度</div><div class="d">孩子听不清时可以调慢</div></div>' +
    '<div class="seg">' +
    [0.8, 0.9, 1.0].map(function (r) {
      return '<button class="' + (Math.abs(s.rate - r) < 0.01 ? 'on' : '') + '" data-act="setRate" data-rate="' + r + '">' + r.toFixed(1) + 'x</button>';
    }).join('') +
    '</div></div>' +
    (ttsOK ? '' : '<div class="hint-strip" style="margin-top:10px">当前浏览器没有语音朗读能力，故事仍会完整显示为文字。</div>') +
    '</div>' +

    '<div class="card">' +
    '<h2 class="section">学习数据</h2>' +
    '<div class="set-row"><div><div class="t">已学成语</div><div class="d">含未到复习时间的</div></div>' +
    '<div class="mono" style="font-weight:700">' + learnedCount + ' / ' + IDIOMS.length + '</div></div>' +
    '<div class="set-row"><div><div class="t">成绩记录</div><div class="d">每次测试都会记录</div></div>' +
    '<div class="mono" style="font-weight:700">' + scoreCount + ' 轮</div></div>' +
    '<div class="set-row"><div><div class="t">导出记录</div><div class="d">下载 JSON 文件，可备份或换手机</div></div>' +
    '<button class="btn btn-ghost btn-sm" data-act="exportData">导出</button></div>' +
    '<div class="set-row"><div><div class="t">清空全部记录</div><div class="d">会删除成绩、错题和复习进度</div></div>' +
    '<button class="btn btn-soft btn-sm" data-act="resetData">清空</button></div>' +
    (!storageOK ? '<div class="hint-strip" style="margin-top:10px">当前打开方式限制了本地存储，记录可能无法保存。建议用“局域网本地服务”或部署到网页后在手机浏览器里打开。</div>' : '') +
    '</div>' +

    '<div class="card">' +
    '<h2 class="section">关于这个小书院</h2>' +
    '<div class="tiny" style="line-height:1.9">' +
    '学习者：' + esc(state.child) + '（家长：' + esc(state.parent) + '）<br>' +
    '每组 10 个成语：先听故事 → 再做考点题（人物、朝代、官职 / 地点、情节、启发）→ 当场出分。<br>' +
    '复习按艾宾浩斯曲线安排：学完当天测一次，之后第 1、2、4、7、15、30 天各复习一次；答错退回两轮，10 分钟后再考，直到全对。<br>' +
    '所有记录只保存在这台设备的浏览器里，不会上传。' +
    '</div>' +
    '<div class="tiny" style="margin-top:10px;color:#9c9182">版本 1.0 · 单文件离线版 · 可直接放到手机上使用</div>' +
    '</div>';
}

/* ---------------- 弹层 ---------------- */
function openIdiomModal(id) {
  var it = BY_ID[id];
  if (!it) return;
  var modal = $('#modal');
  modal.innerHTML = '<div class="modal">' +
    '<div class="modal-box">' +
    '<div class="modal-head"><h3 class="kai">' + esc(it.word) + '</h3>' +
    '<button class="icon-btn" data-act="closeModal">✕</button></div>' +
    '<div class="tiny" style="margin-bottom:8px">' + esc(it.pinyin) + '</div>' +
    knowledgeHTML(it) +
    '<div class="story-box"><h3>成语故事</h3><p class="story-text">' + esc(it.story) + '</p></div>' +
    '<div class="lesson-box"><h3>这个故事告诉我们</h3><div class="txt">' + esc(it.lesson) + '</div></div>' +
    '<div class="nav-btns">' +
    '<button class="btn btn-ghost" data-act="modalSpeak" data-id="' + it.id + '">听故事</button>' +
    '<button class="btn btn-primary" data-act="closeModal">看完了</button>' +
    '</div></div></div>';
  modal.querySelector('.modal').addEventListener('click', function (e) {
    if (e.target.classList.contains('modal')) closeModal();
  });
}
function closeModal() { $('#modal').innerHTML = ''; }

/* ---------------- 数据导出 / 清空 ---------------- */
function exportData() {
  try {
    var payload = { exportedAt: new Date().toISOString(), app: '成语小书院', state: state };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '成语学习记录-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
    toast('已导出记录文件');
  } catch (e) {
    toast('导出失败，可以截图保存成绩页');
  }
}
function resetData() {
  if (!window.confirm('确定清空全部学习记录吗？成绩、错题和复习进度都会被删除，不能恢复。')) return;
  state = defaultState();
  save();
  view = 'home';
  render();
  toast('已清空全部记录');
}

/* ---------------- 交互 ---------------- */
function onClick(e) {
  var t = e.target.closest('[data-act]');
  if (!t) return;
  var act = t.getAttribute('data-act');
  var s = state.session;

  switch (act) {
    case 'go':
      view = t.getAttribute('data-view') || 'home';
      render();
      break;
    case 'startNew':
      startNewGroup();
      break;
    case 'startReview':
      startReview();
      break;
    case 'resumeSession':
      resumeSession();
      break;
    case 'exitSession':
      exitSession();
      break;
    case 'prevListen':
      if (!s) break;
      stopSpeak();
      s.listenIdx = Math.max(0, s.listenIdx - 1);
      save(); render();
      break;
    case 'nextListen':
      if (!s) break;
      stopSpeak();
      s.listenIdx = Math.min(s.ids.length - 1, s.listenIdx + 1);
      save(); render();
      if (state.settings.autoRead) setTimeout(autoReadCurrent, 300);
      break;
    case 'startTest':
      stopSpeak();
      if (!s) break;
      s.phase = 'test';
      s.idx = 0;
      view = 'test';
      save(); render();
      break;
    case 'speakWord':
      if (s) { var itw = BY_ID[s.ids[s.listenIdx]]; if (itw) speak(itw.word); }
      break;
    case 'speakStory':
      if (s) { var its = BY_ID[s.ids[s.listenIdx]]; if (its) speakIdiom(its); }
      break;
    case 'stopSpeak':
      stopSpeak();
      toast('已停止朗读');
      break;
    case 'answerChoice': {
      if (!s) break;
      var item = currentItem();
      if (!item || s.responses[s.idx]) break;
      var di = Number(t.getAttribute('data-di'));
      var orig = item.order[di];
      var q = BY_ID[item.id].q[item.qi];
      submitAnswer(orig === q.a, orig);
      break;
    }
    case 'submitInput': {
      if (!s) break;
      var item2 = currentItem();
      if (!item2 || s.responses[s.idx]) break;
      var input = $('#ansInput');
      var val = input ? input.value : '';
      var q2 = BY_ID[item2.id].q[item2.qi];
      submitAnswer(checkInput(q2, val), val.trim());
      break;
    }
    case 'nextQuestion':
      nextQuestion();
      break;
    case 'drillWrong':
      if (s) startDrill(s.wrongDetails.map(function (w) { return w.id; }));
      break;
    case 'retrySame':
      if (s) {
        state.session = newSession('wrong', s.ids);
        view = 'test';
        save(); render();
      }
      break;
    case 'drillOne':
      startDrill([t.getAttribute('data-id')]);
      break;
    case 'drillAllWrong':
      startDrill(Object.keys(state.wrong));
      break;
    case 'clearWrong':
      delete state.wrong[t.getAttribute('data-id')];
      save(); render();
      break;
    case 'peek':
      openIdiomModal(t.getAttribute('data-id'));
      break;
    case 'closeModal':
      closeModal();
      break;
    case 'modalSpeak':
      speakIdiom(BY_ID[t.getAttribute('data-id')]);
      break;
    case 'exportData':
      exportData();
      break;
    case 'resetData':
      resetData();
      break;
    case 'toggle':
      var key = t.getAttribute('data-key');
      state.settings[key] = !state.settings[key];
      save(); render();
      if (key === 'tts' && state.settings.tts) speak('朗读已经打开');
      break;
    case 'setRate':
      state.settings.rate = Number(t.getAttribute('data-rate')) || 0.9;
      save(); render();
      speak('这是新的朗读速度');
      break;
  }
}

document.addEventListener('click', onClick);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'ansInput') {
    e.preventDefault();
    var btn = document.querySelector('[data-act="submitInput"]');
    if (btn && !btn.disabled) btn.click();
  }
});

/* ---------------- 启动 ---------------- */
render();
if (!storageOK) setTimeout(function () { toast('当前打开方式限制了本地存储，记录可能无法保存', 4200); }, 800);

})();

</script>
